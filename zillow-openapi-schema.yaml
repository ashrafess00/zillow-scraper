      - address
    TaxAssessment:
      type: object
      description: Serializer for the current tax assessment and parcel identifiers.
      properties:
        zpid:
          type: integer
          nullable: true
        tax_assessed_value:
          type: number
          format: double
          nullable: true
        tax_annual_amount:
          type: number
          format: double
          nullable: true
        property_tax_rate:
          type: number
          format: double
          nullable: true
        effective_tax_rate:
          type: number
          format: double
          nullable: true
        parcel_id:
          type: string
        county:
          type: string
        county_fips:
          type: string
        zoning:
          type: string
        zoning_description:
          type: string
    TaxHistoryEvent:
      type: object
      description: Serializer for a single tax-history event.
      properties:
        year:
          type: integer
          nullable: true
        tax_paid:
          type: number
          format: double
          nullable: true
        tax_increase_rate:
          type: number
          format: double
          nullable: true
        assessment:
          type: number
          format: double
          nullable: true
        assessment_increase_rate:
          type: number
          format: double
          nullable: true
    Zestimate:
      type: object
      description: Serializer for a property's valuation estimates.
      properties:
        zpid:
          type: integer
          nullable: true
        zestimate:
          type: number
          format: double
          nullable: true
        rent_zestimate:
          type: number
          format: double
          nullable: true
        price:
          type: number
          format: double
          nullable: true
        currency:
          type: string
tags:
- name: Properties
  description: Property search (by location, coordinates, map bounds, polygon, MLS
    ID, URL or address) and per-property detail by zpid.
- name: Agents
  description: Real-estate agent profiles, reviews, and their for-sale, for-rent and
    sold listings.
- name: Utilities
  description: Location autocomplete, apartment details, and health.
