openapi: 3.0.3
info:
  title: Zillow.com Realtime Scraper API
  version: 1.0.0
  description: Real-time scraping API for Zillow.com real estate data
paths:
  /agentByLocation:
    get:
      operationId: agentByLocation_retrieve
      description: Returns a list of real estate agents in the specified location.
      summary: Get agents by location
      parameters:
      - in: query
        name: location
        schema:
          type: string
        description: Location slug (e.g., los-angeles, new-york-ny, miami-fl)
      - in: query
        name: page
        schema:
          type: integer
        description: Page number
      tags:
      - Agents
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAgentResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /agentForRentProperties:
    get:
      operationId: agentForRentProperties_retrieve
      description: Returns properties currently for rent by a specific agent.
      summary: Get agent's rental properties
      parameters:
      - in: query
        name: agentname
        schema:
          type: string
        description: Agent screen name
      - in: query
        name: page
        schema:
          type: integer
        description: Page number
      - in: query
        name: url
        schema:
          type: string
        description: Agent profile URL
      tags:
      - Agents
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPropertyResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /agentForSaleProperties:
    get:
      operationId: agentForSaleProperties_retrieve
      description: Returns properties currently for sale by a specific agent.
      summary: Get agent's for-sale properties
      parameters:
      - in: query
        name: agentname
        schema:
          type: string
        description: Agent screen name
      - in: query
        name: page
        schema:
          type: integer
        description: Page number
      - in: query
        name: url
        schema:
          type: string
        description: Agent profile URL
      tags:
      - Agents
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPropertyResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /agentInfo:
    get:
      operationId: agentInfo_retrieve
      description: Returns detailed information about a specific agent.
      summary: Get agent information
      parameters:
      - in: query
        name: agentname
        schema:
          type: string
        description: Agent screen name
      - in: query
        name: url
        schema:
          type: string
        description: Agent profile URL
      tags:
      - Agents
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /agentReviews:
    get:
      operationId: agentReviews_retrieve
      description: Returns reviews for a specific agent.
      summary: Get agent reviews
      parameters:
      - in: query
        name: agentname
        schema:
          type: string
        description: Agent screen name
      - in: query
        name: page
        schema:
          type: integer
        description: Page number
      - in: query
        name: url
        schema:
          type: string
        description: Agent profile URL
      tags:
      - Agents
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedReviewResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /agentSoldProperties:
    get:
      operationId: agentSoldProperties_retrieve
      description: Returns properties previously sold by a specific agent.
      summary: Get agent's sold properties
      parameters:
      - in: query
        name: agentname
        schema:
          type: string
        description: Agent screen name
      - in: query
        name: page
        schema:
          type: integer
        description: Page number
      - in: query
        name: url
        schema:
          type: string
        description: Agent profile URL
      tags:
      - Agents
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPropertyResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /apartmentDetails:
    get:
      operationId: apartmentDetails_retrieve
      description: Get detailed information about an apartment or building.
      summary: Get apartment details
      parameters:
      - in: query
        name: url
        schema:
          type: string
        description: Apartment listing URL
        required: true
      tags:
      - Properties
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApartmentDetails'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /autocomplete:
    get:
      operationId: autocomplete_list
      description: Get autocomplete suggestions for a location query.
      summary: Location autocomplete
      parameters:
      - in: query
        name: q
        schema:
          type: string
        description: Search query
        required: true
      tags:
      - Utilities
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AutocompleteSuggestion'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /byAddress:
    get:
      operationId: byAddress_retrieve
      description: Resolve a street address to a single property's full details —
        the same rich payload as /property, without needing a zpid. Returns the best-matching
        property.
      summary: Get property details by address
      parameters:
      - in: query
        name: address
        schema:
          type: string
        description: Street address (e.g., "123 Main St, Austin, TX 78701")
        required: true
      tags:
      - Properties
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PropertyDetails'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /bycoordinates:
    get:
      operationId: bycoordinates_retrieve
      description: Search for properties near specific coordinates.
      summary: Search properties by coordinates
      parameters:
      - in: query
        name: lat
        schema:
          type: number
        description: Latitude
        required: true
      - in: query
        name: listType
        schema:
          type: string
        description: 'Listing type: for-sale, for-rent, sold'
      - in: query
        name: lng
        schema:
          type: number
        description: Longitude
        required: true
      - in: query
        name: page
        schema:
          type: integer
        description: Page number
      - in: query
        name: sort
        schema:
          type: string
        description: 'Sort order: newest, price_low, price_high, sqft, lot, beds,
          baths'
      tags:
      - Properties
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPropertyResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /bylocation:
    get:
      operationId: bylocation_retrieve
      description: Search for properties in a specific location with optional filters.
      summary: Search properties by location
      parameters:
      - in: query
        name: baths
        schema:
          type: integer
        description: Minimum bathrooms
      - in: query
        name: beds
        schema:
          type: integer
        description: Minimum bedrooms
      - in: query
        name: listType
        schema:
          type: string
        description: 'Listing type: for-sale, for-rent, sold'
      - in: query
        name: location
        schema:
          type: string
        description: Location slug (e.g., seattle-wa)
      - in: query
        name: maxPrice
        schema:
          type: number
        description: Maximum price
      - in: query
        name: maxSqft
        schema:
          type: integer
        description: Maximum square footage
      - in: query
        name: minPrice
        schema:
          type: number
        description: Minimum price
      - in: query
        name: minSqft
        schema:
          type: integer
        description: Minimum square footage
      - in: query
        name: page
        schema:
          type: integer
        description: Page number
      - in: query
        name: sort
        schema:
          type: string
        description: 'Sort order: newest, price_low, price_high, sqft, lot, beds,
          baths'
      tags:
      - Properties
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPropertyResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /bymapbounds:
    get:
      operationId: bymapbounds_retrieve
      description: Search for properties within geographic map bounds.
      summary: Search properties by map bounds
      parameters:
      - in: query
        name: east
        schema:
          type: number
        description: Eastern longitude bound
        required: true
      - in: query
        name: listType
        schema:
          type: string
        description: 'Listing type: for-sale, for-rent, sold'
      - in: query
        name: north
        schema:
          type: number
        description: Northern latitude bound
        required: true
      - in: query
        name: page
        schema:
          type: integer
        description: Page number
      - in: query
        name: sort
        schema:
          type: string
        description: 'Sort order: newest, price_low, price_high, sqft, lot, beds,
          baths'
      - in: query
        name: south
        schema:
          type: number
        description: Southern latitude bound
        required: true
      - in: query
        name: west
        schema:
          type: number
        description: Western longitude bound
        required: true
      tags:
      - Properties
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPropertyResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /bymlsid:
    get:
      operationId: bymlsid_retrieve
      description: Search for properties by MLS listing ID.
      summary: Search properties by MLS ID
      parameters:
      - in: query
        name: mlsid
        schema:
          type: string
        description: MLS listing ID
        required: true
      - in: query
        name: page
        schema:
          type: integer
        description: Page number
      tags:
      - Properties
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPropertyResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /bypolygon:
    get:
      operationId: bypolygon_retrieve
      description: Search for properties within a polygon defined by coordinates.
      summary: Search properties by polygon
      parameters:
      - in: query
        name: listType
        schema:
          type: string
        description: 'Listing type: for-sale, for-rent, sold'
      - in: query
        name: page
        schema:
          type: integer
        description: Page number
      - in: query
        name: polygon
        schema:
          type: string
        description: Semicolon-separated coordinates (lat,lng;lat,lng;...)
        required: true
      - in: query
        name: sort
        schema:
          type: string
        description: 'Sort order: newest, price_low, price_high, sqft, lot, beds,
          baths'
      tags:
      - Properties
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPropertyResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /byurl:
    get:
      operationId: byurl_retrieve
      description: Parse and return properties from a Zillow search URL.
      summary: Parse properties from Zillow URL
      parameters:
      - in: query
        name: url
        schema:
          type: string
        description: Zillow search URL
        required: true
      tags:
      - Properties
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPropertyResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /health:
    get:
      operationId: health_retrieve
      description: Lightweight liveness/readiness probe. Reports the status of the
        Redis cache and the database. Always returns HTTP 200; check the `status`
        field (`ok` or `degraded`) and the per-component results in `checks`.
      summary: Health check
      tags:
      - Utilities
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
          description: ''
  /homeFacts:
    get:
      operationId: homeFacts_retrieve
      description: The complete RESO facts block for a property by zpid — appliances,
        heating, cooling, flooring, construction, parking, utilities, HOA and more.
        Null fields are omitted, so the key set varies by listing.
      summary: Get full home facts (RESO)
      parameters:
      - in: query
        name: zpid
        schema:
          type: integer
        description: Zillow Property ID
        required: true
      tags:
      - Properties
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HomeFacts'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /listingAgent:
    get:
      operationId: listingAgent_retrieve
      description: Listing agent, co-listing agent, broker and MLS attribution for
        a property by zpid — names, phone numbers, licenses and MLS id.
      summary: Get listing agent and broker
      parameters:
      - in: query
        name: zpid
        schema:
          type: integer
        description: Zillow Property ID
        required: true
      tags:
      - Properties
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListingAgent'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /listingStatus:
    get:
      operationId: listingStatus_retrieve
      description: Listing status, price-cut tracking and listing-type flags for a
        property by zpid — most recent price change and date, days on Zillow, and
        FSBO / foreclosure / auction / new-build / coming-soon / pending booleans.
      summary: Get listing status and price changes
      parameters:
      - in: query
        name: zpid
        schema:
          type: integer
        description: Zillow Property ID
        required: true
      tags:
      - Properties
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListingStatus'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /monthlyCost:
    get:
      operationId: monthlyCost_retrieve
      description: 'Estimated monthly ownership cost for a property by zpid: principal
        & interest amortized from Zillow''s live mortgage rate, property tax, HOA,
        plus estimated home insurance and PMI. Fields Zillow does not publish are
        listed in `estimated_fields`.'
      summary: Get estimated monthly cost
      parameters:
      - in: query
        name: downPayment
        schema:
          type: number
        description: Down payment as a percent of price (default 20)
      - in: query
        name: interestRate
        schema:
          type: number
        description: Annual interest rate percent; overrides Zillow's live rate
      - in: query
        name: termYears
        schema:
          type: integer
        description: 'Loan term in years: 30 or 15 (default 30)'
      - in: query
        name: zpid
        schema:
          type: integer
        description: Zillow Property ID
        required: true
      tags:
      - Properties
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonthlyCost'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /nearbyAreas:
    get:
      operationId: nearbyAreas_retrieve
      description: Regions Zillow links from a listing by zpid. Each entry includes
        the Zillow region path, which can be passed straight to /bylocation or /byurl
        to widen a search.
      summary: Get nearby cities, neighborhoods and zipcodes
      parameters:
      - in: query
        name: zpid
        schema:
          type: integer
        description: Zillow Property ID
        required: true
      tags:
      - Properties
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NearbyAreas'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /openHouses:
    get:
      operationId: openHouses_list
      description: Scheduled open houses for a property by zpid. Most listings have
        none; an empty list means no upcoming open house, not an error.
      summary: Get open house schedule
      parameters:
      - in: query
        name: zpid
        schema:
          type: integer
        description: Zillow Property ID
        required: true
      tags:
      - Properties
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OpenHouse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /photos:
    get:
      operationId: photos_retrieve
      description: All photo URLs (largest available size) for a property by zpid.
      summary: Get property photos
      parameters:
      - in: query
        name: zpid
        schema:
          type: integer
        description: Zillow Property ID
        required: true
      tags:
      - Properties
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhotosResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /priceHistory:
    get:
      operationId: priceHistory_list
      description: Chronological list of price/listing events for a property by zpid.
      summary: Get property price history
      parameters:
      - in: query
        name: zpid
        schema:
          type: integer
        description: Zillow Property ID
        required: true
      tags:
      - Properties
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PriceHistoryEvent'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /property:
    get:
      operationId: property_retrieve
      description: Full details for a single property by its Zillow Property ID (zpid).
        This is the primary lookup that warms the shared cache for the other zpid
        endpoints (zestimate, priceHistory, taxHistory, photos, schools, similarHomes).
      summary: Get property details
      parameters:
      - in: query
        name: zpid
        schema:
          type: integer
        description: Zillow Property ID
        required: true
      tags:
      - Properties
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PropertyDetails'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /schools:
    get:
      operationId: schools_list
      description: Assigned/nearby schools with ratings for a property by zpid.
      summary: Get nearby schools
      parameters:
      - in: query
        name: zpid
        schema:
          type: integer
        description: Zillow Property ID
        required: true
      tags:
      - Properties
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/School'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /similarHomes:
    get:
      operationId: similarHomes_list
      description: Comparable and nearby homes for a property by zpid.
      summary: Get similar / nearby homes
      parameters:
      - in: query
        name: zpid
        schema:
          type: integer
        description: Zillow Property ID
        required: true
      tags:
      - Properties
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Property'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /taxAssessment:
    get:
      operationId: taxAssessment_retrieve
      description: 'Current-year tax assessment and parcel identifiers for a property
        by zpid: assessed value, annual tax, county rate, parcel id, county FIPS and
        zoning. Use /taxHistory for the year-by-year series.'
      summary: Get current tax assessment
      parameters:
      - in: query
        name: zpid
        schema:
          type: integer
        description: Zillow Property ID
        required: true
      tags:
      - Properties
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaxAssessment'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /taxHistory:
    get:
      operationId: taxHistory_list
      description: Per-year tax paid and assessed value for a property by zpid.
      summary: Get property tax history
      parameters:
      - in: query
        name: zpid
        schema:
          type: integer
        description: Zillow Property ID
        required: true
      tags:
      - Properties
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TaxHistoryEvent'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /zestimate:
    get:
      operationId: zestimate_retrieve
      description: Zestimate and Rent Zestimate for a property by zpid.
      summary: Get property valuation (Zestimate)
      parameters:
      - in: query
        name: zpid
        schema:
          type: integer
        description: Zillow Property ID
        required: true
      tags:
      - Properties
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Zestimate'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
components:
  schemas:
    Agent:
      type: object
      description: Serializer for agent data.
      properties:
        name:
          type: string
        url:
          type: string
        photo_url:
          type: string
        brokerage:
          type: string
        location:
          type: string
        phone:
          type: string
        rating:
          type: number
