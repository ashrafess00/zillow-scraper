      properties:
        name:
          type: string
        rating:
          type: integer
          nullable: true
        level:
          type: string
        grades:
          type: string
        distance:
          type: number
          format: double
          nullable: true
        type:
          type: string
        link:
          type: string
    SimilarHome:
      type: object
      description: A comp from /similarHomes — a property card plus its ranking fields.
      properties:
        zpid:
          type: integer
          nullable: true
        address:
          type: string
        url:
          type: string
        photo_url:
          type: string
        price:
          type: number
          format: double
          nullable: true
        beds:
          type: integer
          nullable: true
        baths:
          type: integer
          nullable: true
        sqft:
          type: integer
          nullable: true
        property_type:
          type: string
        status:
          type: string
        latitude:
          type: number
          format: double
          nullable: true
        longitude:
          type: number
          format: double
          nullable: true
        brokerage:
          type: string
        zestimate:
          type: number
          format: double
          nullable: true
        date_sold:
          type: string
        distance_miles:
          type: number
          format: double
          nullable: true
        similarity_score:
          type: number
          format: double
          nullable: true
