openapi: 3.0.3
info:
  title: Zillow.com Realtime Scraper API
  version: 1.0.0
  description: Real-time scraping API for Zillow.com real estate data
paths:
  /agentByLocation:
    get:
      operationId: agentByLocation
      description: Returns a list of real estate agents in the specified location.
      summary: Get agents by location
      parameters:
      - in: query
        name: location
        schema:
          type: string
        description: Location slug (e.g., los-angeles, new-york-ny, miami-fl)
      - in: query
        name: page
        schema:
          type: integer
        description: Page number
      tags:
      - Agents
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAgentResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /agentForRentProperties:
    get:
      operationId: agentForRentProperties
      description: Returns properties currently for rent by a specific agent.
      summary: Get agent's rental properties
      parameters:
      - in: query
        name: agentname
        schema:
          type: string
        description: Agent screen name
      - in: query
        name: page
        schema:
          type: integer
        description: Page number
      - in: query
        name: url
        schema:
          type: string
        description: Agent profile URL
      tags:
      - Agents
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPropertyResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /agentForSaleProperties:
    get:
      operationId: agentForSaleProperties
      description: Returns properties currently for sale by a specific agent.
      summary: Get agent's for-sale properties
      parameters:
      - in: query
        name: agentname
        schema:
          type: string
        description: Agent screen name
      - in: query
        name: page
        schema:
          type: integer
        description: Page number
      - in: query
        name: url
        schema:
          type: string
        description: Agent profile URL
      tags:
      - Agents
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPropertyResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /agentInfo:
    get:
      operationId: agentInfo
      description: Returns detailed information about a specific agent.
      summary: Get agent information
      parameters:
      - in: query
        name: agentname
        schema:
          type: string
        description: Agent screen name
      - in: query
        name: url
        schema:
          type: string
        description: Agent profile URL
      tags:
      - Agents
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /agentReviews:
    get:
      operationId: agentReviews
      description: Returns reviews for a specific agent.
      summary: Get agent reviews
      parameters:
      - in: query
        name: agentname
        schema:
          type: string
        description: Agent screen name
      - in: query
        name: page
        schema:
          type: integer
        description: Page number
      - in: query
        name: url
        schema:
          type: string
        description: Agent profile URL
      tags:
      - Agents
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedReviewResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /agentSoldProperties:
    get:
      operationId: agentSoldProperties
      description: Returns properties previously sold by a specific agent.
      summary: Get agent's sold properties
      parameters:
      - in: query
        name: agentname
        schema:
          type: string
        description: Agent screen name
      - in: query
        name: page
        schema:
          type: integer
        description: Page number
      - in: query
        name: url
        schema:
          type: string
        description: Agent profile URL
      tags:
      - Agents
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPropertyResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /apartmentDetails:
    get:
      operationId: apartmentDetails
      description: Get detailed information about an apartment or building.
      summary: Get apartment details
      parameters:
      - in: query
        name: url
        schema:
          type: string
        description: Apartment listing URL
        required: true
      tags:
      - Properties
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApartmentDetails'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /autocomplete:
    get:
      operationId: autocomplete
      description: Autocomplete suggestions for a location or address query. Region
        hits carry `region_id`, `region_type` and coordinates; address hits carry
        a `zpid` that can be passed straight to any detail endpoint. Returns an empty
        list when nothing matches.
      summary: Location autocomplete
      parameters:
      - in: query
        name: q
        schema:
          type: string
        description: Search query
        required: true
      tags:
      - Utilities
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AutocompleteSuggestion'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /byAddress:
    get:
      operationId: byAddress
      description: Resolve a street address to a single property's full details —
        the same rich payload as /property, without needing a zpid. Returns the best-matching
        property.
      summary: Get property details by address
      parameters:
      - in: query
        name: address
        schema:
          type: string
        description: Street address (e.g., "123 Main St, Austin, TX 78701")
        required: true
      tags:
      - Properties
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PropertyDetails'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /bycoordinates:
    get:
      operationId: bycoordinates
      description: Search for properties near specific coordinates.
      summary: Search properties by coordinates
      parameters:
      - in: query
        name: lat
        schema:
          type: number
        description: Latitude
        required: true
      - in: query
        name: listType
        schema:
          type: string
        description: 'Listing type: for-sale, for-rent, sold'
      - in: query
        name: lng
        schema:
          type: number
        description: Longitude
        required: true
      - in: query
        name: page
        schema:
          type: integer
        description: Page number
      - in: query
        name: sort
        schema:
          type: string
        description: 'Sort order: newest, price_low, price_high, sqft, lot, beds,
          baths'
      tags:
      - Properties
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPropertyResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /bylocation:
    get:
      operationId: bylocation
      description: Search for properties in a specific location with optional filters.
      summary: Search properties by location
      parameters:
      - in: query
        name: baths
        schema:
          type: integer
        description: Minimum bathrooms
      - in: query
        name: beds
        schema:
          type: integer
        description: Minimum bedrooms
      - in: query
        name: listType
        schema:
          type: string
        description: 'Listing type: for-sale, for-rent, sold'
      - in: query
        name: location
        schema:
          type: string
        description: Location slug (e.g., seattle-wa)
      - in: query
        name: maxPrice
        schema:
          type: number
        description: Maximum price
      - in: query
        name: maxSqft
        schema:
          type: integer
        description: Maximum square footage
      - in: query
        name: minPrice
        schema:
          type: number
        description: Minimum price
      - in: query
        name: minSqft
        schema:
          type: integer
        description: Minimum square footage
      - in: query
        name: page
        schema:
          type: integer
        description: Page number
      - in: query
        name: sort
        schema:
          type: string
        description: 'Sort order: newest, price_low, price_high, sqft, lot, beds,
          baths'
      tags:
      - Properties
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPropertyResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /bymapbounds:
    get:
      operationId: bymapbounds
      description: Search for properties within geographic map bounds.
      summary: Search properties by map bounds
      parameters:
      - in: query
        name: east
        schema:
          type: number
        description: Eastern longitude bound
        required: true
      - in: query
        name: listType
        schema:
          type: string
        description: 'Listing type: for-sale, for-rent, sold'
      - in: query
        name: north
        schema:
          type: number
        description: Northern latitude bound
        required: true
      - in: query
        name: page
        schema:
          type: integer
        description: Page number
      - in: query
        name: sort
        schema:
          type: string
        description: 'Sort order: newest, price_low, price_high, sqft, lot, beds,
          baths'
      - in: query
        name: south
        schema:
          type: number
        description: Southern latitude bound
        required: true
      - in: query
        name: west
        schema:
          type: number
        description: Western longitude bound
        required: true
      tags:
      - Properties
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPropertyResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /bymlsid:
    get:
      operationId: bymlsid
      description: Search for properties by MLS listing ID.
      summary: Search properties by MLS ID
      parameters:
      - in: query
        name: mlsid
        schema:
          type: string
        description: MLS listing ID
        required: true
      - in: query
        name: page
        schema:
          type: integer
        description: Page number
      tags:
      - Properties
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPropertyResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /bypolygon:
    get:
      operationId: bypolygon
      description: Search for properties within a polygon defined by coordinates.
      summary: Search properties by polygon
      parameters:
      - in: query
        name: listType
        schema:
          type: string
        description: 'Listing type: for-sale, for-rent, sold'
      - in: query
        name: page
        schema:
          type: integer
        description: Page number
      - in: query
        name: polygon
        schema:
          type: string
        description: Semicolon-separated coordinates (lat,lng;lat,lng;...)
        required: true
      - in: query
        name: sort
        schema:
          type: string
        description: 'Sort order: newest, price_low, price_high, sqft, lot, beds,
          baths'
      tags:
      - Properties
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPropertyResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /byurl:
    get:
      operationId: byurl
      description: Parse and return properties from a Zillow search URL.
      summary: Parse properties from Zillow URL
      parameters:
      - in: query
        name: url
        schema:
          type: string
        description: Zillow search URL
        required: true
      tags:
      - Properties
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPropertyResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /health:
    get:
      operationId: health
      description: Lightweight liveness/readiness probe. Reports the status of the
        Redis cache and the database. Always returns HTTP 200; check the `status`
        field (`ok` or `degraded`) and the per-component results in `checks`.
      summary: Health check
      tags:
      - Utilities
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
          description: ''
  /homeFacts:
    get:
      operationId: homeFacts
      description: The complete RESO facts block for a property by zpid — appliances,
        heating, cooling, flooring, construction, parking, utilities, HOA and more.
        Null fields are omitted, so the key set varies by listing.
      summary: Get full home facts (RESO)
      parameters:
      - in: query
        name: zpid
        schema:
          type: integer
        description: Zillow Property ID
        required: true
      tags:
      - Properties
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HomeFacts'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /listingAgent:
    get:
      operationId: listingAgent
      description: Listing agent, co-listing agent, broker and MLS attribution for
        a property by zpid — names, phone numbers, licenses and MLS id.
      summary: Get listing agent and broker
      parameters:
      - in: query
        name: zpid
        schema:
          type: integer
        description: Zillow Property ID
        required: true
      tags:
      - Properties
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListingAgent'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /listingStatus:
    get:
      operationId: listingStatus
      description: Listing status, price-cut tracking and listing-type flags for a
        property by zpid — most recent price change and date, days on Zillow, and
        FSBO / foreclosure / auction / new-build / coming-soon / pending booleans.
      summary: Get listing status and price changes
      parameters:
      - in: query
        name: zpid
        schema:
          type: integer
        description: Zillow Property ID
        required: true
      tags:
      - Properties
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListingStatus'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /marketStats:
    get:
      operationId: marketStats
      description: |-
        Market statistics for a city, zipcode, neighborhood, county or state — Zillow Home Value Index and its year-over-year change, median list and sale prices, median days to pending, sale-to-list ratio, inventory, new listings and median rent, plus the parent county / state / national figures for context.

        Zillow publishes listing and sale aggregates on separate monthly cycles, so `listings_as_of` and `sales_as_of` are reported separately rather than reconciled into one date.

        Pass `history=true` for the monthly series behind these numbers (home value index and rent go back ~100 months).
      summary: Get market statistics for a region
      parameters:
      - in: query
        name: history
        schema:
          type: boolean
        description: Include the monthly time series (default false)
      - in: query
        name: location
        schema:
          type: string
        description: 'Region to look up: a slug (`austin-tx`), a place name (`Austin,
          TX`), a zipcode (`90210`), a neighborhood (`park-slope-brooklyn-ny`), a
          county (`travis-county-tx`) or a state (`tx`).'
        required: true
      tags:
      - Properties
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketStats'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /monthlyCost:
    get:
      operationId: monthlyCost
      description: 'Estimated monthly ownership cost for a property by zpid: principal
        & interest amortized from Zillow''s live mortgage rate, property tax, HOA,
        plus estimated home insurance and PMI. Fields Zillow does not publish are
        listed in `estimated_fields`.'
      summary: Get estimated monthly cost
      parameters:
      - in: query
        name: downPayment
        schema:
          type: number
        description: Down payment as a percent of price (default 20)
      - in: query
        name: interestRate
        schema:
          type: number
        description: Annual interest rate percent; overrides Zillow's live rate
      - in: query
        name: termYears
        schema:
          type: integer
        description: 'Loan term in years: 30 or 15 (default 30)'
      - in: query
        name: zpid
        schema:
          type: integer
        description: Zillow Property ID
        required: true
      tags:
      - Properties
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonthlyCost'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /nearbyAreas:
    get:
      operationId: nearbyAreas
      description: Regions Zillow links from a listing by zpid. Each entry includes
        the Zillow region path, which can be passed straight to /bylocation or /byurl
        to widen a search.
      summary: Get nearby cities, neighborhoods and zipcodes
      parameters:
      - in: query
        name: zpid
        schema:
          type: integer
        description: Zillow Property ID
        required: true
      tags:
      - Properties
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NearbyAreas'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /openHouses:
    get:
      operationId: openHouses
      description: Scheduled open houses for a property by zpid. Most listings have
        none; an empty list means no upcoming open house, not an error.
      summary: Get open house schedule
      parameters:
      - in: query
        name: zpid
        schema:
          type: integer
        description: Zillow Property ID
        required: true
      tags:
      - Properties
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OpenHouse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /photos:
    get:
      operationId: photos
      description: All photo URLs (largest available size) for a property by zpid.
      summary: Get property photos
      parameters:
      - in: query
        name: zpid
        schema:
          type: integer
        description: Zillow Property ID
        required: true
      tags:
      - Properties
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhotosResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /priceHistory:
    get:
      operationId: priceHistory
      description: Chronological list of price/listing events for a property by zpid.
      summary: Get property price history
      parameters:
      - in: query
        name: zpid
        schema:
          type: integer
        description: Zillow Property ID
        required: true
      tags:
      - Properties
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PriceHistoryEvent'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /property:
    get:
      operationId: property
      description: Full details for a single property by its Zillow Property ID (zpid).
        This is the primary lookup that warms the shared cache for the other zpid
        endpoints (zestimate, priceHistory, taxHistory, photos, schools, similarHomes).
      summary: Get property details
      parameters:
      - in: query
        name: zpid
        schema:
          type: integer
        description: Zillow Property ID
        required: true
      tags:
      - Properties
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PropertyDetails'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /schools:
    get:
      operationId: schools
      description: Assigned/nearby schools with ratings for a property by zpid.
      summary: Get nearby schools
      parameters:
      - in: query
        name: zpid
        schema:
          type: integer
        description: Zillow Property ID
        required: true
      tags:
      - Properties
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/School'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /similarHomes:
    get:
      operationId: similarHomes
      description: Comparable homes near a property, closest comp first. Each result
        carries `distance_miles` from the subject and a `similarity_score` (lower
        is a closer match, weighing distance, size, beds, baths, price and property
        type). `listType` defaults to the subject's own market, so comps for a sold
        home are other sold homes.
      summary: Get similar / nearby homes
      parameters:
      - in: query
        name: count
        schema:
          type: integer
        description: How many comps to return (1-40, default 8)
      - in: query
        name: listType
        schema:
          type: string
        description: 'Comp market: for-sale, for-rent, sold. Defaults to the subject
          property''s status.'
      - in: query
        name: zpid
        schema:
          type: integer
        description: Zillow Property ID
        required: true
      tags:
      - Properties
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SimilarHome'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /taxAssessment:
    get:
      operationId: taxAssessment
      description: 'Current-year tax assessment and parcel identifiers for a property
        by zpid: assessed value, annual tax, county rate, parcel id, county FIPS and
        zoning. Use /taxHistory for the year-by-year series.'
      summary: Get current tax assessment
      parameters:
      - in: query
        name: zpid
        schema:
          type: integer
        description: Zillow Property ID
        required: true
      tags:
      - Properties
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaxAssessment'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /taxHistory:
    get:
      operationId: taxHistory
      description: Per-year tax paid and assessed value for a property by zpid.
      summary: Get property tax history
      parameters:
      - in: query
        name: zpid
        schema:
          type: integer
        description: Zillow Property ID
        required: true
      tags:
      - Properties
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TaxHistoryEvent'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /zestimate:
    get:
      operationId: zestimate
      description: Zestimate and Rent Zestimate for a property by zpid.
      summary: Get property valuation (Zestimate)
      parameters:
      - in: query
        name: zpid
        schema:
          type: integer
        description: Zillow Property ID
        required: true
      tags:
      - Properties
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Zestimate'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
components:
  schemas:
    Agent:
      type: object
      description: Serializer for agent data.
      properties:
        name:
          type: string
        url:
          type: string
        photo_url:
          type: string
        brokerage:
          type: string
        location:
          type: string
        phone:
          type: string
        rating:
          type: number
          format: double
          nullable: true
        reviews_count:
          type: integer
          nullable: true
        sales_count:
          type: integer
          nullable: true
        price_range:
          type: string
          nullable: true
        is_team:
          type: boolean
          default: false
        bio:
          type: string
      required:
      - name
      - url
    ApartmentDetails:
      type: object
      description: Serializer for apartment details.
      properties:
        url:
          type: string
        name:
          type: string
        address:
          type: string
        description:
          type: string
        units:
          type: array
          items: {}
        amenities:
          type: array
          items: {}
        photos:
          type: array
          items: {}
      required:
      - address
      - name
      - url
    AutocompleteSuggestion:
      type: object
      description: Serializer for autocomplete suggestions.
      properties:
        display:
          type: string
        type:
          type: string
          description: '''region'' or ''address'''
        id:
          type: string
        city:
          type: string
        state:
          type: string
        region_id:
          type: integer
          nullable: true
        region_type:
          type: string
        county:
          type: string
        zipcode:
          type: string
        zpid:
          type: integer
          nullable: true
        address_type:
          type: string
        latitude:
          type: number
          format: double
          nullable: true
        longitude:
          type: number
          format: double
          nullable: true
      required:
      - display
      - type
    Error:
      type: object
      description: Serializer for error responses.
      properties:
        error:
          type: string
        message:
          type: string
        status_code:
          type: integer
      required:
      - error
      - message
      - status_code
    HealthResponse:
      type: object
      properties:
        status:
          type: string
        version:
          type: string
        timestamp:
          type: string
        checks:
          type: object
          additionalProperties: {}
        rapidapi:
          type: object
          additionalProperties: {}
      required:
      - checks
      - rapidapi
      - status
      - timestamp
      - version
    HomeFacts:
      type: object
      description: Serializer for the full RESO facts block.
      properties:
        zpid:
          type: integer
          nullable: true
        fact_count:
          type: integer
          nullable: true
        at_a_glance:
          type: object
          additionalProperties: {}
        facts:
          type: object
          additionalProperties: {}
    ListingAgent:
      type: object
      description: Serializer for listing-agent, co-agent, broker and MLS attribution.
      properties:
        zpid:
          type: integer
          nullable: true
        agent_name:
          type: string
        agent_phone:
          type: string
        agent_email:
          type: string
        agent_license:
          type: string
        co_agent_name:
          type: string
        co_agent_phone:
          type: string
        co_agent_license:
          type: string
        broker_name:
          type: string
        broker_phone:
          type: string
        listing_offices:
          type: array
          items:
            type: string
        buyer_agent_name:
          type: string
        buyer_brokerage_name:
          type: string
        mls_id:
          type: string
        mls_name:
          type: string
        mls_disclaimer:
          type: string
        attribution_contact:
          type: string
        last_updated:
          type: string
        last_checked:
          type: string
    ListingStatus:
      type: object
      description: Serializer for listing status, price-cut tracking and listing-type
        flags.
      properties:
        zpid:
          type: integer
          nullable: true
        status:
          type: string
        listing_type:
          type: string
        price:
          type: number
          format: double
          nullable: true
        price_change:
          type: number
          format: double
          nullable: true
        price_change_date:
          type: string
        date_sold:
          type: string
        last_sold_price:
          type: number
          format: double
          nullable: true
        days_on_zillow:
          type: integer
          nullable: true
        time_on_zillow:
          type: string
        contingent_type:
          type: string
        is_fsbo:
          type: boolean
        is_fsba:
          type: boolean
        is_new_home:
          type: boolean
        is_foreclosure:
          type: boolean
        is_bank_owned:
          type: boolean
        is_for_auction:
          type: boolean
        is_coming_soon:
          type: boolean
        is_pending:
          type: boolean
        page_view_count:
          type: integer
          nullable: true
        favorite_count:
          type: integer
          nullable: true
    MarketAncestor:
      type: object
      description: A region containing the one being described.
      properties:
        name:
          type: string
        type:
          type: string
          description: country, state, dma, cbsa, county or city
      required:
      - name
    MarketBenchmark:
      type: object
      description: Parent-region figures that give a region's numbers context.
      properties:
        county_home_value_index:
          type: number
          format: double
          nullable: true
        state_home_value_index:
          type: number
          format: double
          nullable: true
        national_home_value_index:
          type: number
          format: double
          nullable: true
        national_median_rent:
          type: number
          format: double
          nullable: true
    MarketHistory:
      type: object
      description: Monthly series, newest first. Only present when history=true.
      properties:
        home_value_index:
          type: array
          items:
            $ref: '#/components/schemas/MarketSeriesPoint'
        median_rent:
          type: array
          items:
            $ref: '#/components/schemas/MarketSeriesPoint'
        median_days_to_pending:
          type: array
          items:
            $ref: '#/components/schemas/MarketSeriesPoint'
        median_sale_to_list_ratio:
          type: array
          items:
            $ref: '#/components/schemas/MarketSeriesPoint'
    MarketRegion:
      type: object
      description: The region a /marketStats response describes.
      properties:
        id:
          type: integer
          nullable: true
        name:
          type: string
        type:
          type: string
          description: city, zipcode, neighborhood, county or state
        url:
          type: string
        slug:
          type: string
        parentage:
          type: array
          items:
            $ref: '#/components/schemas/MarketAncestor'
          description: Regions containing this one, widest first (country → state
            → county)
    MarketSeriesPoint:
      type: object
      description: One month of a market time series.
      properties:
        date:
          type: string
        value:
          type: number
          format: double
      required:
      - date
      - value
    MarketStats:
      type: object
      description: Market statistics for a region.
      properties:
        region:
          $ref: '#/components/schemas/MarketRegion'
        listings_as_of:
          type: string
        sales_as_of:
          type: string
        home_value_index:
          type: number
          format: double
          nullable: true
          description: Zillow Home Value Index (ZHVI) for the region
        home_value_index_yoy_pct:
          type: number
          format: double
          nullable: true
          description: Year-over-year change in ZHVI, as a percentage (-5.02 = down
            5.02%)
        median_list_price:
          type: number
          format: double
          nullable: true
        median_sale_price:
          type: number
          format: double
          nullable: true
        median_days_to_pending:
          type: number
          format: double
          nullable: true
        median_sale_to_list_ratio:
          type: number
          format: double
          nullable: true
          description: 'A ratio, not a percentage: 0.98 means homes sell for 98% of
            list price'
        pct_sold_above_list:
          type: number
          format: double
          nullable: true
        pct_sold_below_list:
          type: number
          format: double
          nullable: true
        for_sale_inventory:
          type: number
          format: double
          nullable: true
        new_listings:
          type: number
          format: double
          nullable: true
        median_rent:
          type: number
          format: double
          nullable: true
          description: Zillow Observed Rent Index (ZORI)
        benchmarks:
          $ref: '#/components/schemas/MarketBenchmark'
        history:
          $ref: '#/components/schemas/MarketHistory'
      required:
      - benchmarks
      - region
    MonthlyCost:
      type: object
      description: Serializer for the estimated monthly ownership-cost breakdown.
      properties:
        zpid:
          type: integer
          nullable: true
        price:
          type: number
          format: double
          nullable: true
        down_payment:
          type: number
          format: double
          nullable: true
        down_payment_percent:
          type: number
          format: double
          nullable: true
        loan_amount:
          type: number
          format: double
          nullable: true
        interest_rate:
          type: number
          format: double
          nullable: true
        term_years:
          type: integer
          nullable: true
        rate_source:
          type: string
        principal_and_interest:
          type: number
          format: double
          nullable: true
        property_tax:
          type: number
          format: double
          nullable: true
        property_tax_rate:
          type: number
          format: double
          nullable: true
        home_insurance:
          type: number
          format: double
          nullable: true
        hoa_fee:
          type: number
          format: double
          nullable: true
        mortgage_insurance:
          type: number
          format: double
          nullable: true
        total_monthly:
          type: number
          format: double
          nullable: true
        estimated_fields:
          type: array
          items:
            type: string
        currency:
          type: string
    NearbyAreas:
      type: object
      description: Serializer for the nearby regions Zillow links from a listing.
      properties:
        zpid:
          type: integer
          nullable: true
        cities:
          type: array
          items:
            $ref: '#/components/schemas/NearbyRegion'
        neighborhoods:
          type: array
          items:
            $ref: '#/components/schemas/NearbyRegion'
        zipcodes:
          type: array
          items:
            $ref: '#/components/schemas/NearbyRegion'
    NearbyRegion:
      type: object
      description: Serializer for a single nearby city / neighborhood / zipcode link.
      properties:
        name:
          type: string
        path:
          type: string
        url:
          type: string
    OpenHouse:
      type: object
      description: Serializer for a single scheduled open house.
      properties:
        start_time:
          type: string
        end_time:
          type: string
        description:
          type: string
        display_text:
          type: string
    PaginatedAgentResponse:
      type: object
      properties:
        count:
          type: integer
        results:
          type: array
          items:
            $ref: '#/components/schemas/Agent'
        pagination:
          $ref: '#/components/schemas/PaginationMetadata'
      required:
      - count
      - pagination
      - results
    PaginatedPropertyResponse:
      type: object
      properties:
        count:
          type: integer
        results:
          type: array
          items:
            $ref: '#/components/schemas/Property'
        pagination:
          $ref: '#/components/schemas/PaginationMetadata'
      required:
      - count
      - pagination
      - results
    PaginatedReviewResponse:
      type: object
      properties:
        count:
          type: integer
        results:
          type: array
          items:
            $ref: '#/components/schemas/Review'
        pagination:
          $ref: '#/components/schemas/PaginationMetadata'
      required:
      - count
      - pagination
      - results
    PaginationMetadata:
      type: object
      description: Serializer for pagination metadata.
      properties:
        total_results:
          type: integer
        total_pages:
          type: integer
        current_page:
          type: integer
        per_page:
          type: integer
        has_next:
          type: boolean
        has_previous:
          type: boolean
      required:
      - current_page
      - has_next
      - has_previous
      - per_page
      - total_pages
      - total_results
    PhotosResponse:
      type: object
      properties:
        zpid:
          type: integer
        count:
          type: integer
        photos:
          type: array
          items:
            type: string
      required:
      - count
      - photos
      - zpid
    PriceHistoryEvent:
      type: object
      description: Serializer for a single price-history event.
      properties:
        date:
          type: string
        event:
          type: string
        price:
          type: number
          format: double
          nullable: true
        price_change_rate:
          type: number
          format: double
          nullable: true
        price_per_sqft:
          type: number
          format: double
          nullable: true
        source:
          type: string
    Property:
      type: object
      description: Serializer for property data.
      properties:
        zpid:
          type: integer
          nullable: true
        address:
          type: string
        url:
          type: string
        photo_url:
          type: string
        price:
          type: number
          format: double
          nullable: true
        beds:
          type: integer
          nullable: true
        baths:
          type: integer
          nullable: true
        sqft:
          type: integer
          nullable: true
        property_type:
          type: string
        status:
          type: string
        latitude:
          type: number
          format: double
          nullable: true
        longitude:
          type: number
          format: double
          nullable: true
        brokerage:
          type: string
        zestimate:
          type: number
          format: double
          nullable: true
        date_sold:
          type: string
      required:
      - address
    PropertyDetails:
      type: object
      description: Serializer for a single property's full details (by zpid).
      properties:
        zpid:
          type: integer
          nullable: true
        url:
          type: string
        address:
          type: string
        price:
          type: number
          format: double
          nullable: true
        zestimate:
          type: number
          format: double
          nullable: true
        rent_zestimate:
          type: number
          format: double
          nullable: true
        price_per_sqft:
          type: number
          format: double
          nullable: true
        beds:
          type: integer
          nullable: true
        baths:
          type: integer
          nullable: true
        sqft:
          type: integer
          nullable: true
        lot_size:
          type: number
          format: double
          nullable: true
        year_built:
          type: integer
          nullable: true
        property_type:
          type: string
        status:
          type: string
        latitude:
          type: number
          format: double
          nullable: true
        longitude:
          type: number
          format: double
          nullable: true
        description:
          type: string
        brokerage:
          type: string
        mls_id:
          type: string
        mls_name:
          type: string
        hoa_fee:
          type: number
          format: double
          nullable: true
        days_on_zillow:
          type: integer
          nullable: true
        page_view_count:
          type: integer
          nullable: true
        favorite_count:
          type: integer
          nullable: true
        photo_count:
          type: integer
          nullable: true
        photo_url:
          type: string
    Review:
      type: object
      description: Serializer for review data.
      properties:
        zuid:
          type: string
        rating:
          type: integer
        review:
          type: string
        reviewer_name:
          type: string
        date:
